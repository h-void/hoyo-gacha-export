name: Update ID Maps

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-idmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opencc

      - name: Update Star Rail and ZZZ idJson.json
        run: python tools/getIdMap.py --game all

      - name: Check changes
        id: check_changes
        run: |
          if git diff --quiet -- src/games/starrail/idJson.json src/games/zzz/idJson.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated idJson files
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          HSR_VER=$(python -c "import json; print(json.load(open('src/games/starrail/idJson.json', encoding='utf-8'))['version'])")
          ZZZ_VER=$(python -c "import json; print(json.load(open('src/games/zzz/idJson.json', encoding='utf-8'))['version'])")
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/games/starrail/idJson.json src/games/zzz/idJson.json
          git commit -m "chore: update idJson (HSR ${HSR_VER}, ZZZ ${ZZZ_VER})"
          git push
